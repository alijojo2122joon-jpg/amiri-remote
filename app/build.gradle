plugins { id 'com.android.application' }
android {
    namespace 'com.amiri.remote'
    compileSdk 34
    defaultConfig {
        applicationId "com.amiri.remote"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "13.0"
    }
    signingConfigs {
        fixed {
            storeFile file('amiri.keystore')
            storePassword 'amiri123'
            keyAlias 'amiri'
            keyPassword 'amiri123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
