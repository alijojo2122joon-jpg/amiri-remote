name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AmiriRemote-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to apk branch
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/AmiriRemote.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add AmiriRemote.apk
          git commit -qm "APK build"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
